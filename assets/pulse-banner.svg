<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b1f4b"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
<clipPath id="c"><rect width="900" height="220" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="900" height="220" fill="url(#bg)"/>
<rect width="900" height="220" fill="url(#grid)" opacity="0.6"/>
<rect y="-40" width="900" height="40" fill="#22d3ee" opacity="0.06"><animate attributeName="y" from="-40" to="220" dur="4s" repeatCount="indefinite"/></rect>
<path d="M0 170 H150 L180 170 L200 130 L225 205 L250 100 L275 170 H430 L450 170 L470 140 L490 190 L510 170 H900" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="3"/>
<path d="M0 170 H150 L180 170 L200 130 L225 205 L250 100 L275 170 H430 L450 170 L470 140 L490 190 L510 170 H900" fill="none" stroke="url(#ln)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1200" stroke-dashoffset="1200">
<animate attributeName="stroke-dashoffset" values="1200;0;0;-1200" keyTimes="0;0.55;0.8;1" dur="4s" repeatCount="indefinite"/></path>
<circle cx="46" cy="40" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/><animate attributeName="r" values="5;8;5" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="62" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86efac" letter-spacing="3">LIVE 24x7</text>
<text x="450" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#f8fafc">PulseWorkshop 24x7
<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
<text x="450" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8" letter-spacing="1">Enterprise AI Telephony &amp; Log Diagnostics Platform
<animate attributeName="opacity" values="0;0;1" keyTimes="0;.5;1" dur="2s" fill="freeze"/></text>
