<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>

  <!-- pulse line -->
  <path d="M0 150 L150 150 L180 150 L200 110 L225 185 L250 80 L275 150 L420 150 L450 150 L470 120 L490 170 L510 150 L900 150"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1100" stroke-dashoffset="1100">
    <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- live dot -->
  <circle cx="46" cy="40" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;8;5" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86efac" letter-spacing="3">LIVE 24x7</text>

  <text x="450" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">PulseWorkshop 24x7</text>
  <text x="450" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">Enterprise AI Telephony &amp; Log Diagnostics Platform</text>
</svg>
